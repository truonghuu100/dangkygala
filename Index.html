<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE">
  <title>Đăng ký tham dự - HUST 70 năm</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#e8edf5;color:#253044}
    main{max-width:560px;margin:24px;padding:28px;background:#fff;border-radius:16px;box-shadow:0 10px 30px #1c2b4515;text-align:center}
    a{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:9px;background:#2453c7;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Đăng ký tham dự – HUST 70 năm</h1>
    <p>Đang chuyển đến website đăng ký chính thức...</p>
    <p>Nếu không tự chuyển, vui lòng bấm nút bên dưới.</p>
    <a id="openSite" href="PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE">Mở website đăng ký</a>
  </main>
  <script>
    // Thay URL mẫu bên dưới bằng URL Web App Apps Script kết thúc bằng /exec.
    const APP_SCRIPT_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
    document.getElementById('openSite').href = APP_SCRIPT_URL;
    if (APP_SCRIPT_URL.startsWith('https://script.google.com/macros/s/') && APP_SCRIPT_URL.endsWith('/exec')) {
      window.location.replace(APP_SCRIPT_URL);
    }
  </script>
</body>
</html>
